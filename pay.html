<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>차칵(골든카케어) 1초 결제 안내</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f6f9;
      color: #191f28;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 22px;
      padding: 28px 22px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .badge {
      display: inline-block;
      background: #fee500;
      color: #191919;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .notice-box {
      background: #fff8db;
      border: 1.5px solid #ffd43b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .notice-title {
      font-size: 14px;
      font-weight: 800;
      color: #b45309;
      margin-bottom: 6px;
    }
    .notice-desc {
      font-size: 14px;
      line-height: 1.55;
      color: #333d4b;
      word-break: keep-all;
    }
    .notice-desc strong {
      color: #d9480f;
      background: #fff3bf;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .btn-kakao {
      display: block;
      width: 100%;
      text-align: center;
      background: #fee500;
      color: #191919;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      padding: 16px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      transition: transform 0.1s ease;
    }
    .btn-kakao:active { transform: scale(0.98); }
    .account-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .account-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 3px;
    }
    .account-num {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .btn-copy {
      border: none;
      background: #1e293b;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .toast {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #0f766e;
      min-height: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">골든카케어 [차칵]</span>
    <h1>1초 결제 전,<br />차량번호만 꼭 적어주세요</h1>

    <div class="notice-box">
      <div class="notice-title">📌 빠른 입금 확인 안내</div>
      <p class="notice-desc">
        • <strong>카카오페이 송금</strong>: 입금자명이 일부 가려져 표시되므로, 송금 후 <strong>문자나 카톡으로 차량번호 4자리</strong>를 꼭 말씀 부탁드립니다.<br /><br />
        • <strong>계좌이체</strong>: 송금 시 <strong>'받는 분에게 표시'</strong>에 <strong>차량번호 4자리</strong>를 적어주시면 바로 확인됩니다.
      </p>
    </div>

    <a class="btn-kakao" href="https://qr.kakaopay.com/FbQzkFIjH">
      🟡 카카오페이 바로 송금하기
    </a>

    <div class="account-box">
      <div>
        <div class="account-label">계좌이체 안내 (예금주: 권동우)</div>
        <div class="account-num">카카오뱅크 3333-01-3009763</div>
      </div>
      <button type="button" class="btn-copy" onclick="copyAccount()">계좌복사</button>
    </div>

    <div id="toast" class="toast"></div>
  </main>

  <script>
    function copyAccount() {
      var acct = "3333013009763";
      var toast = document.getElementById("toast");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(acct).then(function() {
          toast.textContent = "계좌번호가 복사되었습니다! 송금 시 차량번호 4자리를 적어주세요.";
        }).catch(function() {
          fallbackCopy(acct, toast);
        });
      } else {
        fallbackCopy(acct, toast);
      }
    }
    function fallbackCopy(text, toast) {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        toast.textContent = "계좌번호가 복사되었습니다! 송금 시 차량번호 4자리를 적어주세요.";
      } catch (e) {
        toast.textContent = "카카오뱅크 3333-01-3009763 (권동우)";
      }
      document.body.removeChild(ta);
    }
  </script>
</body>
</html>
